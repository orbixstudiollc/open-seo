services:
  open-seo:
    image: ${OPEN_SEO_IMAGE:-ghcr.io/every-app/open-seo:latest}
    restart: unless-stopped
    # Anonymous usage heartbeat controls: docs/SELF_HOSTING_DOCKER.md#telemetry
    environment:
      # Required for local Docker self-hosting: exposes Compose env vars to cloudflare:workers bindings.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - ALLOWED_HOST=${ALLOWED_HOST:-}
      - AUTH_MODE=local_noauth
      - OPENSEO_TELEMETRY_DISABLED=${OPENSEO_TELEMETRY_DISABLED:-}
      - DO_NOT_TRACK=${DO_NOT_TRACK:-}
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      # Optional: Google Search Console. See
      # docs/SELF_HOSTING_GOOGLE_SEARCH_CONSOLE.md
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      # Optional report sharing/digests. Public sharing remains disabled unless
      # the operator explicitly declares a share-only proxy/origin.
      - REPORT_PUBLIC_SHARE_MODE=${REPORT_PUBLIC_SHARE_MODE:-}
      - REPORT_PUBLIC_ORIGIN=${REPORT_PUBLIC_ORIGIN:-}
      - LOOPS_API_KEY=${LOOPS_API_KEY:-}
      - LOOPS_TRANSACTIONAL_REPORT_DIGEST_ID=${LOOPS_TRANSACTIONAL_REPORT_DIGEST_ID:-}
      # Optional: AI provider for the in-app chat agents (SAM + onboarding).
      # Either OpenRouter:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # ...or your own OpenAI-compatible provider. AI_BASE_URL selects it, and
      # AI_API_KEY + AI_MODEL are required alongside it.
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - VITE_SHOW_DEVTOOLS=false
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - open_seo_data:/app/.wrangler
volumes:
  open_seo_data:
